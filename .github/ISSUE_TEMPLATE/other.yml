name: 建议或其他 / Suggestion or other
description: 功能建议、软件包需求、新机型、提问 / Feature ideas, package requests, new boards, questions
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        固件出了问题请用"问题反馈"。/ For something broken, use the Bug report form instead.
  - type: textarea
    id: body
    attributes:
      label: 内容 / Details
      description: 想要什么，为什么需要 / What you would like, and why
    validations:
      required: true
