name: 问题反馈 / Bug report
description: H3C Magic NSS 固件出了问题 / Something is broken on an H3C Magic NSS image
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库是 H3C Magic NSS：给 H3C RC3000 / RT3000 / RW3000 / NX30（HW-A/B/C/D）做的 OpenWrt 主线 + NSS 加速固件。
        用 kuncy7 的镜像或自己编译的镜像也可以在这里反馈，请在下面写明是哪个。
        中文或英文都可以。硬件系列以 U-Boot 救援页"系统信息"为准，不要按零售型号选。

        H3C Magic NSS: mainline OpenWrt with NSS offload for the H3C RC3000 / RT3000 / RW3000 / NX30
        (HW-A/B/C/D). Reports on kuncy7's images or self-built images are welcome too; say which below.
        Chinese or English is fine. Take the hardware group from the System information page of the
        U-Boot rescue page, not from the retail model name.

  - type: dropdown
    id: hw
    attributes:
      label: 硬件系列 / Hardware group
      options:
        - HW-A
        - HW-B
        - HW-C
        - HW-D
        - 不确定 / Not sure
    validations:
      required: true

  - type: dropdown
    id: ram
    attributes:
      label: 内存 / RAM
      options:
        - 256 MB
        - 512 MB
        - 不确定 / Not sure
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: 固件版本 / Firmware
      description: 本项目的版本号，或 kuncy7 的发布标签，或自己编译的提交号 / This project's version, kuncy7's release tag, or the commit you built
      placeholder: v0.1.0-pre.5 / ipq50xx-2026.11.11 / self-built 2d541c5a7a
    validations:
      required: true

  - type: input
    id: uboot
    attributes:
      label: U-Boot 版本 / U-Boot version
      description: 救援页"系统信息"里的版本 / As shown on the rescue page System information
      placeholder: v0.1.0-ddad68d1835b

  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happens
      description: 看到的现象，以及期望的结果 / What you see, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 网络连接方式（有线、Wi-Fi、中继）、客户端设备、出现频率 / Topology (wired, Wi-Fi, repeater), client devices, how often it happens
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: |
        能贴多少贴多少，SSH 到路由器执行 / As much as you can, over SSH on the router:

        ```sh
        ubus call system board
        free -m
        logread | tail -n 200
        dmesg | tail -n 100
        ```

        内存不足（OOM）或掉速时，再加上 / For OOM or throughput drops, also:

        ```sh
        grep -E "pbuf_def|payload" /sys/kernel/debug/qca-nss-drv/stats/n2h
        ```
      render: text

  - type: textarea
    id: extra
    attributes:
      label: 其他 / Anything else
      description: 装了哪些插件、改过哪些设置、截图等 / Installed packages, changed settings, screenshots
